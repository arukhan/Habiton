name: Checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: habiton
          POSTGRES_PASSWORD: habiton_ci_only
          POSTGRES_DB: habiton_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U habiton -d habiton_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      HABITON_TEST_DATABASE_URL: postgres://habiton:habiton_ci_only@127.0.0.1:5432/habiton_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - run: go test -mod=readonly -count=1 ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
